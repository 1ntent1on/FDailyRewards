plugins {
    id 'java'
}

group = 'com.fretka46'
version = '1.1.1'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

dependencies {
    // Paper 26.3 běží na Javě 25. sqlite-jdbc dodává server (Paper), proto jen pro testy.
    compileOnly 'io.papermc.paper:paper-api:26.3.build.200-stable'
    compileOnly 'me.clip:placeholderapi:2.12.3'

    // jen kvůli testu načtení config.yml přes skutečné YamlConfiguration (SnakeYAML jako na serveru)
    testImplementation('io.papermc.paper:paper-api:26.3.build.200-stable') {
        // knihovny pro stahování závislostí za běhu serveru, YAML test je nepotřebuje
        exclude group: 'org.apache.maven.resolver'
        exclude group: 'org.apache.maven'
        exclude group: 'org.apache.httpcomponents'
        exclude group: 'commons-codec'
        exclude group: 'org.slf4j', module: 'jcl-over-slf4j'
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'
    testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.16'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

tasks.named('test') {
    useJUnitPlatform()
    // volitelně: gradle test -PprodDb=C:/cesta/database.db (kopie produkční DB, jen čtení + migrace kopie)
    systemProperty 'fdr.prodDb', findProperty('prodDb') ?: ''
    testLogging { events 'failed'; exceptionFormat 'full' }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
