# =====================================================================================================
# Nové klíče ve verzi 1.1.0 (hodnoty výše zůstávají beze změny; chybějící klíč se bere z tohoto výchozího souboru)
# =====================================================================================================

# Časová zóna pro "den odměn" (reset v day_reset_time se počítá v ní, ne v zóně systému)
timezone: "Europe/Prague"

# Zapnutí připomínek "máš dostupnou odměnu" (příkaz reward_claim_available_command)
show_reward_claim_available_message: true
# Jak často smyčka kontroluje online hráče (sekundy). Interval mezi připomínkami je reward_claim_available_interval (minuty)
reminder_tick_seconds: 10
# První připomínka po připojení za tolik sekund
reminder_join_delay_seconds: 8
# Připomínka po resetu dne (např. 04:15) se rozloží náhodně do tolika sekund, ať nejde všem naráz
reminder_rollover_jitter_seconds: 60

# Přechodová podpora: kdo má tuto permission, bere se mu Login Pass jako aktivní (staré nákupy přes LuckPerms).
# Po převedení držitelů na "fdailyrewards admin givepass" a úpravě Tebexu nastav na "" (vypnuto).
legacy_pass_permission: "survival.premium.dailylogin"

# Kdo koupí Login Pass v posledních N dnech měsíce (včetně dnešního) bez aktivního Passu, dostane místo toho další měsíc. 0 = vypnuto.
pass_late_purchase_days: 0

# Nejvíc dní, které odemkne jeden příkaz "admin unlockmissed"
unlock_max_days: 31

# Režim "admin giftnext" (nástroj pro AT na požádání hráče, ne Tebex balíček):
#   catchup = dá jen zameškaný den (další den k vyzvednutí už kalendářně nastal), jinak odmítne
#   any     = dá i den dopředu (hráč ho dostane dřív, ale za měsíc nezíská víc a zítra nemá co vyzvednout)
giftnext_mode: catchup

# Neúspěšné nákupní příkazy z konzole (givepass, setvip = Login Pass z Tebexu) se vždy zapíšou do failed-purchases.log.
# Tebex nabije i při neúspěchu (např. Pass koupený pro jméno, které na serveru nikdy nehrálo), takže je potřeba
# Pass zadat ručně správnému hráči, nebo platbu vrátit. Volitelně se spustí i tento příkaz z konzole
# (např. "discordsrv broadcast #kanal Nákup {command} pro {player} selhal: {reason}"). Prázdné = vypnuto.
failed_purchase_command: ""

# Při hromadném předání (unlockmissed give víc dní, víc dárků z fronty po připojení) se příkazy odměn začínající
# některým z těchto prefixů nespustí; hráč místo nich dostane jednu souhrnnou zprávu (unlock_done / gifts_received).
# Předání jednoho dne (běžné vyzvednutí, giftnext, giftday) běží beze změny.
bulk_skip_command_prefixes:
  - "discordsrv broadcast"
  - "cmi ctext"
  - "cmi bossbarmsg"

# Jak dlouho (ms) se drží vyhodnocený stav hráče pro PlaceholderAPI (menu volá placeholdery velmi často)
placeholder_cache_millis: 5000

# Texty placeholderů %fdr_...% (klíče nejsou "yes"/"no", YAML by je přečetl jako true/false)
placeholders:
  yes_text: "yes"
  no_text: "no"
  dash: "–"
  less_than_minute: "méně než minuta"

# Zvuky (prázdné = bez zvuku)
sound_denied: "thecivia:thecivia.sound.27"
sound_claimed: "thecivia:thecivia.sound.34"

# Zprávy (prefix se přidá automaticky). {day} / {count} se nahradí.
non_functional_vip_only: "Tato položka je pouze pro hráče s <#ff002e>Login Passem<gray>!"
gift_received: "Byla ti věnována odměna za den <#ff002e>{day}<gray>!"
unlock_done: "Odemčeno dní: <#ff002e>{count}<gray>."
gifts_received: "Byly ti doručeny odměny za dny <#ff002e>{days}<gray>!"
